[build]
  command = "npm run build"
  publish = "dist"

# Run the live Vite dev server under `netlify dev` (with HMR) and proxy to it,
# instead of serving the last-built static dist/. Without this block, `netlify
# dev` can fall back to the stale dist build — which is why local edits
# sometimes didn't show up until a manual rebuild.
#   - command:    must match your package.json "dev" script (usually `vite`)
#   - targetPort: the port Vite prints on startup (Vite default is 5173)
[dev]
  command = "npm run dev"
  targetPort = 5173

[functions."digest"]
schedule = "0 * * * *"

[functions."pipeline-alerts"]
schedule = "0 * * * *"

[functions."task-reminders"]
schedule = "* * * * *"

[functions."score-leads-batch"]
schedule = "0 6 * * *"

# Security headers — served on every response. These improve the domain's
# standing with corporate proxy / reputation engines (Zscaler, Netskope, etc.)
# and are good practice regardless. Deliberately NO Content-Security-Policy yet:
# a blind CSP would risk breaking Clerk scripts and R2 document previews;
# add one later only with a full origin inventory.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The customer's job-status link (state §0.111): /status/<token> is served by
# the public dispatch-status function. Netlify applies redirects in order, so
# this MUST stay above the SPA catch-all or the SPA (and its sign-in wall)
# swallows it. The token rides as a PATH segment: Netlify substitutes a
# placeholder into a path but not into a query string (`?t=:token` reached the
# function as the literal ":token" on the first dev probe).
[[redirects]]
  from = "/status/:token"
  to = "/.netlify/functions/dispatch-status/:token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
