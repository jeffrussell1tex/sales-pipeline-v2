name: Tests

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Unit + static guard import only pure modules (no DB, no deps).
      - name: Unit tests + org-scoping guard
        run: node --test

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # These three ran only on Jeff's machine, by hand. Anything pushed without
      # running them reached Netlify ungated.
      - name: TDZ scan (reads before declaration)
        run: npm run check:tdz
      - name: Inline-component scan (remount on keystroke)
        run: npm run check:inline
      # The dummy key is REQUIRED. Without it `vite build` exits 0 and emits a
      # 212 kB bundle containing no application — see scripts/check-bundle.mjs.
      # `npm run build` runs the bundle guard, so this job fails on a hollow build.
      # Duplicate keys/attributes silently discard the earlier value. esbuild
      # already warns, but the warnings scroll past above a 2,500 kB summary and
      # the build exits 0. Nine were shipping when this gate was added.
      - name: Duplicate key / attribute scan
        run: npm run check:dupes
      # Promoted from diagnostic to gate once all 78 original sites were resolved
      # and the scanner's accuracy was pinned by fixtures. It ran as a diagnostic
      # only while its accuracy was unproven — the first version reported a 59%
      # false-positive rate on the hooks. A finding now means new code discarding a
      # Response, not pre-existing noise. Deliberate exceptions carry a
      # `dbfetch-ignore:` comment at the call site.
      - name: Discarded-Response dbFetch scan
        run: npm run check:dbfetch
      - name: Build + bundle guard
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Org-isolation integration tests (real Neon test branch)
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "DATABASE_URL_TEST secret not set — skipping integration tests."
            echo "Add it under Settings -> Secrets and variables -> Actions to enable."
            exit 0
          fi
          npm run test:int
